<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="581px" preserveAspectRatio="none" style="width:590px;height:581px;background:#FFFFFF;" version="1.1" viewBox="0 0 590 581" width="590px" zoomAndPan="magnify"><title>SSD 7 &#8212; Import and Export Availability CSV</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="313.4482" x="139.28" y="28.5352">SSD 7 &#8212; Import and Export Availability CSV</text><rect fill="none" height="90.8867" style="stroke:#000000;stroke-width:1.5;" width="551.0083" x="32" y="200.5977"/><rect fill="none" height="90.8867" style="stroke:#000000;stroke-width:1.5;" width="440.7148" x="32" y="400.7266"/><g><title>AdministrativeStaff</title><rect fill="#000000" fill-opacity="0.00000" height="455.5684" width="8" x="105.644" y="118.9766"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="109" x2="109" y1="118.9766" y2="574.5449"/></g><g><title>:System</title><rect fill="#000000" fill-opacity="0.00000" height="455.5684" width="8" x="425.4512" y="118.9766"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="429.1875" x2="429.1875" y1="118.9766" y2="574.5449"/></g><g class="participant participant-head" data-participant="Staff"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.2881" x="42" y="116.0234">AdministrativeStaff</text><ellipse cx="109.644" cy="50.9883" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M109.644,58.9883 L109.644,85.9883 M96.644,66.9883 L122.644,66.9883 M109.644,85.9883 L96.644,100.9883 M109.644,85.9883 L122.644,100.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-head" data-participant="System"><rect fill="#E2E2F0" height="30.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.5273" x="396.1875" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.5273" x="403.1875" y="108.0234">:System</text></g><path d="M61,133.9766 L61,158.9766 L476,158.9766 L476,143.9766 L466,133.9766 L61,133.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M466,133.9766 L466,143.9766 L476,143.9766 L466,133.9766" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.6553" x="91.5298" y="151.5449">PoC starts empty; no database is loaded automatically.</text><g class="message" data-participant-1="Staff" data-participant-2="System"><polygon fill="#181818" points="417.4512,181.5977,427.4512,185.5977,417.4512,189.5977,421.4512,185.5977" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="109.644" x2="423.4512" y1="185.5977" y2="185.5977"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.5762" x="175.2595" y="180.8555">importAvailability(sourcePath)</text></g><path d="M32,200.5977 L94.1387,200.5977 L94.1387,207.9082 L84.1387,217.9082 L32,217.9082 L32,200.5977" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="90.8867" style="stroke:#000000;stroke-width:1.5;" width="551.0083" x="32" y="200.5977"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="47" y="214.166">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="468.8696" x="109.1387" y="213.2324">[unreadable file, invalid header/row, duplicate interval, or overlapping availability]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="120.644,235.2188,110.644,239.2188,120.644,243.2188,116.644,239.2188" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="114.644" x2="428.4512" y1="239.2188" y2="239.2188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.8071" x="121.644" y="234.4766">importRejected, row/error details (no changes)</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="32" x2="583.0083" y1="248.2188" y2="248.2188"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.1973" x="37" y="258.8535">[all rows valid]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="120.644,279.4844,110.644,283.4844,120.644,287.4844,116.644,283.4844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="114.644" x2="428.4512" y1="283.4844" y2="283.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.2627" x="144.4163" y="278.7422">imported slot count, professional count</text></g><path d="M17,303.4844 L17,358.4844 L520,358.4844 L520,313.4844 L510,303.4844 L17,303.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M510,303.4844 L510,313.4844 L520,313.4844 L510,303.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="482.7266" x="23" y="321.0527">UTF-8 CSV headers: First Name, Last Name, Title, Specialty, Date, Start, End.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.9829" x="23" y="336.3633">Imports create/reuse professionals and explicit availability slots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.1494" x="23" y="351.6738">They do not create patients, bookings, resources or waiting-list entries.</text><g class="message" data-participant-1="Staff" data-participant-2="System"><polygon fill="#181818" points="417.4512,381.7266,427.4512,385.7266,417.4512,389.7266,421.4512,385.7266" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="109.644" x2="423.4512" y1="385.7266" y2="385.7266"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.5884" x="161.2534" y="380.9844">exportAvailability(destinationPath)</text></g><path d="M32,400.7266 L94.1387,400.7266 L94.1387,408.0371 L84.1387,418.0371 L32,418.0371 L32,400.7266" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="90.8867" style="stroke:#000000;stroke-width:1.5;" width="440.7148" x="32" y="400.7266"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="47" y="414.2949">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="175.6348" x="109.1387" y="413.3613">[destination cannot be written]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="120.644,435.3477,110.644,439.3477,120.644,443.3477,116.644,439.3477" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="114.644" x2="428.4512" y1="439.3477" y2="439.3477"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2847" x="163.4053" y="434.6055">exportFailed (domain unchanged)</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="32" x2="472.7148" y1="448.3477" y2="448.3477"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="70.5923" x="37" y="458.9824">[file written]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="120.644,479.6133,110.644,483.6133,120.644,487.6133,116.644,483.6133" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="114.644" x2="428.4512" y1="483.6133" y2="483.6133"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.0903" x="207.5024" y="478.8711">exported slot count</text></g><path d="M5,503.6133 L5,558.6133 L536,558.6133 L536,513.6133 L526,503.6133 L5,503.6133" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M526,503.6133 L526,513.6133 L536,513.6133 L526,503.6133" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.6299" x="11" y="521.1816">Export includes the entire availability dataset, not only free slots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.7002" x="11" y="536.4922">This is an availability interchange, not a complete booking/patient backup.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="510.0596" x="11" y="551.8027">The sample schema contains no booking-status or resource-allocation columns.</text><!--SRC=[ZLFDRjGm4BxdAKQSMYdRFOAAX5JrHq82LB65-wmzkndgsC4psMvkF0HFo9CmJbAwgqB5pR8zdxy_AsiWMAsku3Ny-l4JthTToWeOFLpln-N53ZdWcWFh09UhhrN3dc2JagxJlf9xZXrcR47eUq_HqKSImIrT1Dv6S1ILSeLEKuOBtt9aqOpAErefRZQ00kEYCX1bnnr6XLVdgq6KsbVZyRYiObA2jACytQ-dxNEuJPSWQiC2r7Owl8MOmAFY6eM01K92JnwmrzJQmmv36CwgwVN5EtZ4uL7ueTWJINrsT8lQd5OO5FgO2JskpR0D1wg1umu3UsXic_8ofuSQVDy5UyJ8Sf5k5semxOLvmAxZk0KyUAI2cG4i2fd2wf7BP_f6JidNOC1BojbWFAdD2foOIDTWt9ASLXHCgSagzmH6IY_0cXSIae9BVTGQkfmsbXYdY67QgoZwVzXTVRcxMRmfBPWropdSS1Q5JzYQ8H_mp_Ak5Ak6LKUEpRoXXYipfIvmsPwzZlwiciecuCnNfMMcteGS4fAnYBGlbh8U6JUAaBFghg41VBBKTSQ1pcAstaaDwvIidrjRPPhIb1B60xBQzY9O6S5kPYP3Cja5XPvtW_RFkk593