44">locationID, dateTime, referralID?, waitingListEntryID?)</text><path d="M259.1113,696.4766 L321.25,696.4766 L321.25,703.7871 L311.25,713.7871 L259.1113,713.7871 L259.1113,696.4766" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="297.6836" style="stroke:#000000;stroke-width:1.5;" width="570.2046" x="259.1113" y="696.4766"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="274.1113" y="710.0449">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.5811" x="336.25" y="709.1113">[all scheduling, referral and resource checks pass]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="259.1113" x2="829.3159" y1="764.0977" y2="764.0977"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="351.8174" x="264.1113" y="776.7324">[slot taken, outside schedule, or patient/professional overlap]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="259.1113" x2="829.3159" y1="824.3633" y2="824.3633"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.2871" x="264.1113" y="836.998">[required resource cannot be allocated]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="259.1113" x2="829.3159" y1="884.6289" y2="884.6289"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="156.5298" x="264.1113" y="897.2637">[referral missing or invalid]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="259.1113" x2="829.3159" y1="944.8945" y2="944.8945"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.5718" x="264.1113" y="957.5293">[access denied, invalid input, or audit failure]</text><polygon fill="#181818" points="286.1113,741.0977,276.1113,745.0977,286.1113,749.0977,282.1113,745.0977" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="745.0977" y2="745.0977"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.9902" x="433.2185" y="740.3555">appointmentID, status = requested</text><polygon fill="#181818" points="286.1113,801.3633,276.1113,805.3633,286.1113,809.3633,282.1113,805.3633" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="805.3633" y2="805.3633"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.272" x="496.5776" y="800.6211">slotUnavailable</text><polygon fill="#181818" points="286.1113,861.6289,276.1113,865.6289,286.1113,869.6289,282.1113,865.6289" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="865.6289" y2="865.6289"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.5024" x="480.9624" y="860.8867">resourceUnavailable</text><polygon fill="#181818" points="286.1113,921.8945,276.1113,925.8945,286.1113,929.8945,282.1113,925.8945" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="925.8945" y2="925.8945"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9976" x="441.7148" y="921.1523">referralRequired / referralInvalid</text><polygon fill="#181818" points="286.1113,982.1602,276.1113,986.1602,286.1113,990.1602,282.1113,986.1602" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="986.1602" y2="986.1602"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.9893" x="359.719" y="981.418">accessDenied / invalidInput / notFound / auditUnavailable</text><path d="M229.6575,1041.1602 L229.6575,1112.1602 L858.6575,1112.1602 L858.6575,1051.1602 L848.6575,1041.1602 L229.6575,1041.1602" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M848.6575,1041.1602 L848.6575,1051.1602 L858.6575,1051.1602 L848.6575,1041.1602" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="467.2192" x="273.9087" y="1058.7285">Search is advisory, not a reservation. Booking revalidates and reserves the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="522.0439" x="273.9087" y="1074.0391">full service interval plus required resources atomically. No automatic confirmation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="531.6099" x="273.9087" y="1089.3496">Ordinary booking omits waitingListEntryID; SSD 5 supplies the exact accepted entry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="518.2988" x="273.9087" y="1104.6602">A failed booking may be followed by a new search and an explicit waitlist request.</text><!--SRC=[VLR1RkCs4BthAwPxSW35swBe9Oksy3Oj4A3j5d4NFJGzZAcHpOOYLP9oLZtr8_g5_P8-KdGih-Cz114bpinxZuyp_gptlEsOehY_AVf1ggYZ4LglR-aB-k-VV-bU_XeaH5hrlTCsTc8ZBTv_z_cNLzLEDqAjSt7ZFbJXKTkUFNSKKeHLyfE4m5jP6Rsrf10dlc8LdQTLqschG_GSzLxMaTkME51-g90aQgLxHg5ND-inHEbUvS_viR8k2hcz-6b_NLwlXhX33QquIaCXvzmuznY0q1EJboqgYiV77cKJ3Ow46586O1HXrsQaVkUiBAiL_L8sTJpI42Jl3DoXT2y9jxE1d3LZJe-FsfDxiYYZd6-MbTY64j9gOdVzJO5_0tdOgrr9lr1U0vJcgufDH0JgHRNJTdj0ML69fEkK96MxeT__o6Vpitlcqhh1DfKO83rzzLBunpK2BShJtMrD5YnhQg3Zk_Qjzd5tXIHPTIDj9DSUqapKrCwv886UCxnviE2XkzxW6