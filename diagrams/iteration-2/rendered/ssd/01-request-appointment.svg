 style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="259.5293" y2="259.5293"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.7349" x="475.8462" y="254.7871">[] &#8212; No patient found</text><polygon fill="#181818" points="286.1113,315.7949,276.1113,319.7949,286.1113,323.7949,282.1113,319.7949" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="319.7949" y2="319.7949"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.8457" x="390.7908" y="315.0527">matching patients (patientID, name, dateOfBirth)</text><path d="M29,332.7949 L29,372.7949 L270,372.7949 L270,342.7949 L260,332.7949 L29,332.7949" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M260,332.7949 L260,342.7949 L270,342.7949 L260,332.7949" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.7729" x="35" y="350.3633">Staff chooses patientID;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.1113" x="35" y="365.6738">no implicit choice among matches.</text><polygon fill="#181818" points="801.3159,395.7266,811.3159,399.7266,801.3159,403.7266,805.3159,399.7266" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.1113" x2="807.3159" y1="399.7266" y2="399.7266"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.2046" x="287.1113" y="394.9844">searchAvailability(serviceID, professionalID?, locationID?, dateRange, specialtyID?)</text><path d="M240.1113,411.7266 L302.25,411.7266 L302.25,419.0371 L292.25,429.0371 L240.1113,429.0371 L240.1113,411.7266" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="596.4336" style="stroke:#000000;stroke-width:1.5;" width="614.2046" x="240.1113" y="411.7266"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="255.1113" y="425.2949">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="98.8979" x="317.25" y="424.3613">[no eligible slots]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="240.1113" x2="854.3159" y1="598.5898" y2="598.5898"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.8477" x="245.1113" y="611.2246">[eligible slots exist]</text><polygon fill="#181818" points="286.1113,456.3477,276.1113,460.3477,286.1113,464.3477,282.1113,460.3477" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="280.1113" x2="812.3159" y1="460.3477" y2="460.3477"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.2759" x="485.0757" y="455.6055">[] &#8212; No availability</text><path d="M259.1113,472.3477 L326.2964,472.3477 L326.2964,479.6582 L316.2964,489.6582 L259.1113,489.6582 L259.1113,472.3477" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="101.2422" style="stroke:#000000;stroke-width:1.5;" width="570.2046" x="259.1113" y="472.3477"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.1851" x="274.1113" y="485.916">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.8813" x="341.2964" y="484.9824">[patient requests a waiting-list place]</text><polygon fill="#181818" points="801.3159,532.2793,811.3159,536.2793,801.3159,540.2793,805.3159,536.2793" style=