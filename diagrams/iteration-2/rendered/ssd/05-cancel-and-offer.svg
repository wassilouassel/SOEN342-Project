" y1="212.9082" y2="212.9082"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="131.0815" x="15" y="223.543">[cancellation succeeds]</text><g class="message" data-participant-1="System" data-participant-2="Canceller"><polygon fill="#181818" points="129.9834,244.1738,119.9834,248.1738,129.9834,252.1738,125.9834,248.1738" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="123.9834" x2="779.4663" y1="248.1738" y2="248.1738"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.769" x="340.8403" y="243.4316">appointmentID, status = cancelled</text></g><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="306.6108,288.7949,296.6108,292.7949,306.6108,296.7949,302.6108,292.7949" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="300.6108" x2="779.4663" y1="292.7949" y2="292.7949"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.6729" x="401.2021" y="272.7422">eligible entries (entryID, patientID, criteria),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.0889" x="420.9941" y="288.0527">highest priority first (possibly empty)</text></g><path d="M197.9668,307.7949 L272.4136,307.7949 L272.4136,315.1055 L262.4136,325.1055 L197.9668,325.1055 L197.9668,307.7949" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="548.8105" style="stroke:#000000;stroke-width:1.5;" width="659.7964" x="197.9668" y="307.7949"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="29.4468" x="212.9668" y="321.3633">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="450.1514" x="287.4136" y="320.4297">[priority order: while staff continues, slot available, and no successful booking]</text><path d="M228,330.1055 L228,370.1055 L742,370.1055 L742,340.1055 L732,330.1055 L228,330.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M732,330.1055 L732,340.1055 L742,340.1055 L732,330.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="493.7461" x="234" y="347.6738">Staff selects the highest-priority eligible entry not yet contacted in this round.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="448.4302" x="234" y="362.9844">Staff may choose among entries of equal priority; no automatic calling.</text><g class="message" data-participant-1="Staff" data-participant-2="Patient"><polygon fill="#181818" points="663.7144,393.0371,673.7144,397.0371,663.7144,401.0371,667.7144,397.0371" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="295.6108" x2="669.7144" y1="397.0371" y2="397.0371"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.1035" x="307.6108" y="392.2949">Offer available appointment by phone (outside software)</text></g><g class="message" data-participant-1="Patient" data-participant-2="Staff"><polygon fill="#181818" points="306.6108,422.3477,296.6108,426.3477,306.6108,430.3477,302.6108,426.3477" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="300.6108" x2="674.7144" y1="426.3477" y2="426.3477"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.0146" x="431.1553" y="421.6055">Accept or decline</text></g><path d="M207.9668,441.3477 L270.1055,441.3477 L270.1055,448.6582 L260.1055,458.6582 L207.9668,458.6582 L207.9668,441.3477" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="408.2578" style="stroke:#000000;stroke-width:1.5;" width="639.7964" x="207.9668" y="441.3477"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="222.9668" y="454.916">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="94.2842" x="285.1055" y="453.9824">[patient accepts]</text><g class="message" data-participant-1="Staff" data-participant-2="System"><polygon fill="#181818" points="768.4663,491.2793,778.4663,495.2793,768.4663,499.2793,772.4663,495.2793" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="295.6108" x2="774.4663" y1="495.2793" y2="495.2793"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.3438" x="357.8667" y="475.2266">requestAppointment(patientID, serviceID, professionalID,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.418" x="340.8296" y="490.5371">locationID, dateTime, referralID?, waitingListEntryID = entryID)</text></g><path d="M217.9668,510.2793 L280.1055,510.2793 L280.1055,517.5898 L270.1055,527.5898 L217.9668,527.5898 L217.9668,510.2793" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="192.1289" style="stroke:#000000;stroke-width:1.5;" width="619.7964" x="217.9668" y="510.2793"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="232.9668" y="523.8477">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="274.812" x="295.1055" y="522.9141">[booking and selected-entry validation succeed]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="306.6108,544.9004,296.6108,548.9004,306.6108,552.9004,302.6108,548.9004" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="300.6108" x2="779.4663" y1="548.9004" y2="548.9004"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.8633" x="323.1069" y="544.1582">appointmentID, status = requested, entryID, entryStatus = accepted</text></g><path d="M247,561.9004 L247,601.9004 L827,601.9004 L827,571.9004 L817,561.9004 L247,561.9004" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M817,561.9004 L817,571.9004 L827,571.9004 L817,561.9004" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.1548" x="339.5002" y="579.4688">Atomically book, link this exact entry, and mark it accepted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.7627" x="339.5002" y="594.7793">Other matching entries are unchanged; stop this offer round.</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="217.9668" x2="837.7632" y1="608.5215" y2="608.5215"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.0005" x="222.9668" y="619.1563">[availability changed or validation fails]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="306.6108,655.0977,296.6108,659.0977,306.6108,663.0977,302.6108,659.0977" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="300.6108" x2="779.4663" y1="659.0977" y2="659.0977"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.168" x="355.4546" y="639.0449">slotUnavailable / resourceUnavailable / referralRequired /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2114" x="411.9329" y="654.3555">referralInvalid / invalidInput / notFound</text></g><path d="M247,672.0977 L247,697.0977 L827,697.0977 L827,682.0977 L817,672.0977 L247,672.0977" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M817,672.0977 L817,682.0977 L827,682.0977 L817,672.0977" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.7207" x="305.5212" y="689.666">No appointment or entry changes; stop if the slot is no longer available.</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="207.9668" x2="847.7632" y1="710.4082" y2="710.4082"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="98.3286" x="212.9668" y="721.043">[patient declines]</text><path d="M217.9668,731.3633 L285.1519,731.3633 L285.1519,738.6738 L275.1519,748.6738 L217.9668,748.6738 L217.9668,731.3633" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="75.9316" style="stroke:#000000;stroke-width:1.5;" width="605.7632" x="217.9668" y="731.3633"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.1851" x="232.9668" y="744.9316">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.4565" x="300.1519" y="743.998">[staff chooses to remove patient from waiting list]</text><g class="message" data-participant-1="Staff" data-participant-2="System"><polygon fill="#181818" points="768.4663,765.9844,778.4663,769.9844,768.4663,773.9844,772.4663,769.9844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="295.6108" x2="774.4663" y1="769.9844" y2="769.9844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.9951" x="437.041" y="765.2422">removeWaitingListEntry(entryID)</text></g><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="306.6108,795.2949,296.6108,799.2949,306.6108,803.2949,302.6108,799.2949" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="300.6108" x2="779.4663" y1="799.2949" y2="799.2949"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.6167" x="455.2302" y="794.5527">entryID, status = removed</text></g><path d="M247,819.2949 L247,844.2949 L827,844.2949 L827,829.2949 L817,819.2949 L247,819.2949" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M817,819.2949 L817,829.2949 L827,829.2949 L817,819.2949" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="477.5913" x="294.0859" y="836.8633">Otherwise the patient stays on the waiting list and may receive a later offer.</text><path d="M247,875.6055 L247,961.6055 L827,961.6055 L827,885.6055 L817,875.6055 L247,875.6055" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M817,875.6055 L817,885.6055 L827,885.6055 L817,875.6055" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.9966" x="264.8201" y="893.1738">Cancellation frees appointment capacity and its allocated resources.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="463.3599" x="264.8201" y="908.4844">The system identifies eligible entries using their preferences and priority.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.9629" x="264.8201" y="923.7949">Declined entries not removed remain eligible for later offer rounds.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="536.123" x="264.8201" y="939.1055">A phone offer does not reserve capacity; acceptance uses normal booking validation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.7188" x="264.8201" y="954.416">No offer IDs, hold/withdrawal workflow, automatic removal or new eligibility ban.</text><!--SRC=[XLRBRkGs4BphAne-sS3OFkKoHX8Crhk0WIGRn1linHTQQeqOKwH2KfxLBH-HByoNf9gaDFBOJWwsAJwAtLrLJKST3TFz_IrzH__yzJTzKBPcGxjXSDh6dcqaPHlwtBRiQVUij56FEB1QhphTCBNEnKVthGfFsWxAgvu2_paom7xc4DIUTqRlBTKumBvITNIUpdvLKSiDrxHhUcrrY1upptmVLTkUaGeb7BCSUMEVR4k36VMhGaxOmmsL2n9K6LU8BkfQ3meNdstl9spiquOyh9OhwVA7ChUbEaskiZvNn_7TxKMbJ2oR3EvnbZp_mJLYgAY0q2Nm5l0jMHS_kH6rlIPLroZIBLlDygdjipAwGLAHApQ1NoA74Tkv2UyYlmXjGm4uOw3lPvJJc5BnjiGWI0ktEEOr1pgNmIG8GowT36klGQ1M5vi7s-bzno7IuBN3z4IjzlWy7rm8G9g8-o5E5xZDE3SSjpdVI9Y7JkEsa3YidOtQZXmGhd7GtAoqJPAVTJdh4DhHqADpKDaUk2HLP7BFO2kbiPbPbhKiZy06H0IA7LE9-789vKNIaw3Hn365euGzS863Ef0NggvMiBsQgEwS0pkgTtQ_bCsr1EKhi-Hx8-6hCReUiTLWmHX4dx4u9GUQZy1Wf2InBRPRYh5cbXud6ZfdcSxT68DuCBWs7fJdYuGscsj5yGub72BgJmtN229VAz8j32Sb3Z6a-LL0imsyU3h4jGzMsWZidtNDIJ7UjM0BSbK6tm_Mk3gfLnORwFgBxi6jP-JdPSkF6ph0joZCJx3knwmyQBPeyA949B4M-fCmChdSN6R-aczUkAISUqlmxzca9CdDXXO7fC7zl2DNQGL-giBIIkRb7RZNmlkKWjyGQl-KTSNVeBCCdwNUA_z4EYvtN2qedw5WZ_LOTtgbDn1EewqxPVVSt20DM2r1koIUbN1V2GwVqbsAlhGHHnGW4ScgcYrsXF-efPZsTtiKwZMg6DpeQpwTpOJ_XXfhBztkmIuYo6tls03lx33Aup1tolyfzvP-SIySWXIoB79EeHH7jwaNf3w3Ci6S1lvT-smk5vSxKvLcYnJhpDLmC5JfOQaReD4ufDaZlEL8wrq_ovlaQJfMyhN3vEJN4okSdzZWpVuzQtKbPC5gJf9vltn9O0UDNAK-S_20co0ccoRNIHIvJhYdPhp6f0Wl552Jy9R-LkNVylEEJJwiNxVMiuXwHMEj1bMBDEK-ZKuE8qatWNfcaOMhwejGcek2NeZNf1Lpl7hKnY3X8nNjqQH4UV8_IaZOSyE-gcupnyroJ1w6Kaxvg_0iBD0jTBPAF3iE4UrAVywpZLjWf4_oajPDiReK0U6bNRvNopEtik5L1OLdkBjRF9MTCytrGSUkyUg04mVddrhZ3flLSvEYnXg2j7meKMUhFoeWpWtXNm00]--></g></svg>