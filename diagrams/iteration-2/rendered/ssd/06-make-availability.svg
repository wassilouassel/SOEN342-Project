<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="456px" preserveAspectRatio="none" style="width:587px;height:456px;background:#FFFFFF;" version="1.1" viewBox="0 0 587 456" width="587px" zoomAndPan="magnify"><title>SSD 6 &#8212; Make Availability</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="187.7422" x="198.9346" y="28.5352">SSD 6 &#8212; Make Availability</text><rect fill="none" height="135.1523" style="stroke:#000000;stroke-width:1.5;" width="534.6792" x="10" y="231.2188"/><g><title>AdministrativeStaff</title><rect fill="#000000" fill-opacity="0.00000" height="330.3262" width="8" x="83.644" y="118.9766"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="87" x2="87" y1="118.9766" y2="449.3027"/></g><g><title>:System</title><rect fill="#000000" fill-opacity="0.00000" height="330.3262" width="8" x="497.4155" y="118.9766"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="501.1519" x2="501.1519" y1="118.9766" y2="449.3027"/></g><g class="participant participant-head" data-participant="Staff"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.2881" x="20" y="116.0234">AdministrativeStaff</text><ellipse cx="87.644" cy="50.9883" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M87.644,58.9883 L87.644,85.9883 M74.644,66.9883 L100.644,66.9883 M87.644,85.9883 L74.644,100.9883 M87.644,85.9883 L100.644,100.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-head" data-participant="System"><rect fill="#E2E2F0" height="30.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.5273" x="468.1519" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.5273" x="475.1519" y="108.0234">:System</text></g><g class="message" data-participant-1="Staff" data-participant-2="System"><polygon fill="#181818" points="489.4155,161.5977,499.4155,165.5977,489.4155,169.5977,493.4155,165.5977" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="87.644" x2="495.4155" y1="165.5977" y2="165.5977"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.645" x="120.2073" y="145.5449">makeAvailability(professionalID, locationID, dateRange,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.1592" x="152.4502" y="160.8555">recurrence, startTime, endTime, slotMinutes)</text></g><path d="M39,178.5977 L39,218.5977 L548,218.5977 L548,188.5977 L538,178.5977 L39,178.5977" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M538,178.5977 L538,188.5977 L548,188.5977 L538,178.5977" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.3911" x="53.8289" y="196.166">recurrence = weekly(set of weekdays) or monthly(dayOfMonth).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="471.0215" x="53.8289" y="211.4766">Date bounds are inclusive. A missing monthly day (e.g. Feb 31) is skipped.</text><path d="M10,231.2188 L72.1387,231.2188 L72.1387,238.5293 L62.1387,248.5293 L10,248.5293 L10,231.2188" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="135.1523" style="stroke:#000000;stroke-width:1.5;" width="534.6792" x="10" y="231.2188"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="25" y="244.7871">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="447.9009" x="87.1387" y="243.8535">[professional/location missing, malformed pattern, or invalid time/slot length]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="98.644,265.8398,88.644,269.8398,98.644,273.8398,94.644,269.8398" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="92.644" x2="500.4155" y1="269.8398" y2="269.8398"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.5889" x="219.7354" y="265.0977">notFound / invalidInput</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="544.6792" y1="278.8398" y2="278.8398"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="278.7383" x="15" y="289.4746">[generated interval overlaps existing availability]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="98.644,310.1055,88.644,314.1055,98.644,318.1055,94.644,314.1055" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="92.644" x2="500.4155" y1="314.1055" y2="314.1055"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.7314" x="167.1641" y="309.3633">duplicateAvailability (no partial creation)</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="544.6792" y1="323.1055" y2="323.1055"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="332.9541" x="15" y="333.7402">[valid pattern and all generated intervals are conflict-free]</text><g class="message" data-participant-1="System" data-participant-2="Staff"><polygon fill="#181818" points="98.644,354.3711,88.644,358.3711,98.644,362.3711,94.644,358.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="92.644" x2="500.4155" y1="358.3711" y2="358.3711"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.7715" x="99.644" y="353.6289">scheduleID, created slot IDs (possibly empty if no occurrence)</text></g><path d="M8,378.3711 L8,433.3711 L580,433.3711 L580,388.3711 L570,378.3711 L8,378.3711" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M570,378.3711 L570,388.3711 L580,388.3711 L570,378.3711" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="442.7935" x="14" y="395.9395">Whole slots only; the daily interval must divide exactly by slotMinutes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="484.3325" x="14" y="411.25">Example: November 2026, weekly Mondays, 09:00-12:00, slotMinutes = 30.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="551.6113" x="14" y="426.5605">Creating professional availability does not reserve rooms, equipment or assisting roles.</text><!--SRC=[TLFDQjj04BxhAJvoia5Md0G2TMd1r0tau1RgGY-zhAIHl6H_rDsHQztw47t2Fabd9Rjn8BsOMQzsvliRrcm8kzq6z_ZpwpUswecmFYXjLAcDvY7RwvhGUC-bFsRnIRjE1MKHwKTFhg8jnQXQMXlTEbJac4AcAlO1wzfgfoC7nVf0ErPD0nKn5faqOLtfJZd6rMetH2PxDLwFPJPzldX_EgzW1TWbhbaNV2EpjNVAF6vo65_98EzINIkcBygrb7ztWQe-X0GrHsGP-rLRASdLKn6DvwrsFLESPyupmHyeJ33p4vhd7dY7dqHFPfX5OlXcFDLgY7C8PUiTx-LE_lZSRDDXNcGR0OFIzwwEK86WNMNwA98KMCDgeU3Qyqj1Fc16HLlWWKhStSoX8qJrhgEwo0Gq4iHC6SQb0DTdzkU6kGXc6XyirUWKYoikJmYrEoYZQx1mlqxKOSYrlCzmKXgB97eYlqgZ7X9kN9_VFRgkvunC9BJaIAoL_ZgPBjUZS4Pr4NGKtnCjTPcarqRKVMUqG7_XBMREOqo8DAq2ZSpcqzW9_eaIb81Jnhm2PjAwygwH_hne0j6h06Arfxetb68pZf8UeowFcuXPvqNDKdmXsmaktOWcyDKv3VFaoFz2ystlPRLIhmZlpF0Ml2SnM4kxVvBPFZ9gVKXBHaTP7BaiXyjG5jd7exATeHK-oH1RofpRvUrzVWeY96SfW3cMRrRBvUBcLdvVn5eoUxSiiW-Za6BAPN1UE8JQozT21u6Yu2C4xwrqbbtNdP